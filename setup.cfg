[metadata]
name = opticode
version = 0.1.0
description = Compact prompt optimizer and CLI wrapper for Codex CLI and Claude Code
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Opticode

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    opticode = opticode.cli:main
